app:
  api-prefix: /api/v1.0.0

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://identity-service:8080
          predicates:
            - Path=${app.api-prefix}/identity/**
          filters:
            - StripPrefix=2

        - id: profile-service
          uri: http://profile-service:8081
          predicates:
            - Path=${app.api-prefix}/profile/**
          filters:
            - StripPrefix=2

springdoc:
  swagger-ui:
    urls:
      - name: Identity Service
        url: ${app.api-prefix}/identity/v3/api-docs
      - name: Profile Service
        url: ${app.api-prefix}/profile/v3/api-docs


server:
  port: 8888
