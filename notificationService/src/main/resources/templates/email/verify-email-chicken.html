<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Email</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 20px auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
        }
        .header {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin-top: 15px;
        }
        .content {
            font-size: 16px;
            color: #555;
            line-height: 1.6;
            margin: 20px 0;
        }
        .otp-code {
            font-size: 28px;
            font-weight: bold;
            color: #d32f2f;
            margin: 20px 0;
        }
        .footer {
            font-size: 12px;
            color: #777;

            margin-top: 30px;
        }
    </style>
</head>
<body>
<div class="container">
    <img src="https://tuandanh-profile-avatars.s3.amazonaws.com/59f5e939-713f-4e72-a536-1bcb8cb1e464_Screenshot 2024-07-25 103656.png"
         alt="Charity Logo" class="logo">
    <div class="header">Verify Your Email</div>
    <div class="content">
        Your one-time verification code is:
    </div>
    <div class="otp-code">[[${otp_code}]]</div>
    <div class="content">
        This code is valid for a limited time. Please do not share it with anyone.
    </div>
    <div class="footer">
        If you did not request this verification, please ignore this email.<br>
        Thank you, <br>
        Charity Application Team
    </div>
</div>
</body>
</html>
